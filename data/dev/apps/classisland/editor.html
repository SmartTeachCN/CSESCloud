<div class="builtin-app-info">
  <h3>ClassIsland 静态集控</h3>
  <p>该实例应用由平台的「轻编辑器 → 分发配置」创建和管理。</p>
  <ul>
    <li>源文件：ClassIsland 档案（Profile JSON）</li>
    <li>对外接口：<code>/classisland/manifest?id=&lt;实例组标识&gt;</code></li>
    <li>数据源：<code>/classisland/file?id=&lt;实例组标识&gt;/&lt;实例标识&gt;&amp;key=&lt;数据源&gt;</code></li>
  </ul>
  <p>请在轻编辑器中对 ClassIsland 档案右键「分发配置」，然后在实例视图中获取清单地址。</p>
</div>
